@if (!showActions && url) {
  <a [href]="url" class="footer-link">{{ title }}</a>
} @else {
  <p-card>
    <ng-template pTemplate="header">
      @if (image) {
        <div class="card-product-image-wrapper">
          <img
            class="card-product-image"
            width="200"
            height="200"
            alt="{{ title }}"
            [ngSrc]="image"
          />
        </div>
      }
    </ng-template>
    <div class="product-title">{{ title }}</div>
    @if (description) {
      <div class="product-description">{{ description }}</div>
    }
    @if (product && product.priceCents !== undefined) {
      <div class="product-price">{{ product.priceCents / 100 | currency:'EUR' }}</div>
    }
    @if (showActions) {
      <button pButton type="button" class="add-to-cart-btn" [disabled]="!product" (click)="product && storefront.add(product)" [attr.aria-label]="'Add ' + title + ' to cart'">Add to cart</button>
    }
  </p-card>
}
