<p>STEP WRAPPER</p>
<router-outlet></router-outlet>
<div class="step-wrapper">
  <mnx-carousel-primeng
    [items]="steps"
    [routeIds]="RouteIds"
    [activeIndex]="activeIndex"
    [buttonClassFn]="buttonClassFn"
    (itemClick)="changeStep($event.id)"
    (carouselChange)="onCarouselChange($event)"
  ></mnx-carousel-primeng>
</div>
