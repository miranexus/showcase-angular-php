<div class="carousel-banner">
  <div class="carousel-scroll-overlay"></div>
  <p-carousel [value]="currentImages" [numVisible]="1" [numScroll]="1" [circular]="true" [autoplayInterval]="3000" [showIndicators]="false">
    <ng-template pTemplate="item" let-image>
      <div class="aspect-ratio-box">
        <img ngSrc="{{image}}" alt="Banner Image" width="1000" height="190" priority />
      </div>
    </ng-template>
  </p-carousel>
</div>
