<p-carousel
  [value]="cards"
  [circular]="true"
  [numScroll]="1"
  [numVisible]="6"
  [responsiveOptions]="responsiveOptions"
  styleClass="product-carousel"
>
  <ng-template pTemplate="item" let-card>
    <mnx-card-product
      [image]="card.image"
      [title]="card.title"
      [description]="card.description"
      [product]="card"
      [showActions]="card.showActions !== false"
    ></mnx-card-product>
  </ng-template>
</p-carousel>
