<p-carousel
  styleClass="step-carousel"
  [page]="activeIndex"
  [value]="items"
  [circular]="false"
  [numScroll]="1"
  [numVisible]="1"
  [showIndicators]="true"
  [showNavigators]="true"
  [responsiveOptions]="[{ breakpoint: '768px', numVisible: 1, numScroll: 1 }]"
  (onPage)="onCarouselChange($event)"
>
  <ng-template pTemplate="item" let-item>
    <div class="step-item">
      <button
        class="p-button-rounded"
        type="button"
        pButton=""
        [ngClass]="buttonClassFn(item)"
        (click)="onItemClick(item)"
      >
        <i [class]="item[iconField]"></i> {{ item[labelField] }}
      </button>
    </div>
  </ng-template>
</p-carousel>
