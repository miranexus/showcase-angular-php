<nav class="collection-nav" aria-label="Browse collections">
  <button type="button" class="nav-arrow" aria-label="Scroll collections left" (click)="scrollCollections(-1)">
    <i class="pi pi-chevron-left" aria-hidden="true"></i>
  </button>
  <div #collectionLinks class="footer-links">
    @for (link of links; track link.title) {
      <button type="button" class="footer-link" (click)="storefront.browse(link.category, link.collection)">{{ link.title }}</button>
    }
  </div>
  <button type="button" class="nav-arrow" aria-label="Scroll collections right" (click)="scrollCollections(1)">
    <i class="pi pi-chevron-right" aria-hidden="true"></i>
  </button>
</nav>
