<p-toolbar>
  <div class="p-toolbar-group-start">
    <p-button icon="pi pi-bars" [rounded]="true" [text]="true" styleClass="hamburger-btn" />
    <div class="acme-logo">
      <i class="pi pi-bolt"></i>
      <span>Acme</span>
    </div>
  </div>
  <div class="p-toolbar-group-center">
    <div class="search-bar">
      <span class="search-icon"></span>
      <input type="text" pInputText placeholder="Search products..." />
    </div>
  </div>
  <div class="p-toolbar-group-end">
    <p-button icon="pi pi-search" [rounded]="true" [text]="true" styleClass="search-btn-mobile" />
    <p-button icon="pi pi-shopping-cart" [rounded]="true" [text]="true" styleClass="cart-btn" />
  </div>
</p-toolbar>
